[workspace]
resolver = "2"
members = [
  "crates/wellmanifest-core",
  "crates/wellmanifest-cli",
  "crates/wellmanifest-wasm",
  "crates/wellmanifest-python",
  "crates/wellmanifest-node"
]
default-members = ["crates/wellmanifest-core", "crates/wellmanifest-cli"]

[workspace.package]
version = "0.2.0-rc.4"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/wellmanifest/wellm"
rust-version = "1.82"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
wasm-bindgen = "=0.2.100"
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py311"] }
napi = { version = "2", features = ["napi8"] }
napi-derive = "2"
napi-build = "2"
