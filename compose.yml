name: wellmanifest

x-runtime-environment: &runtime-environment
  WELLMANIFEST_HOST: ${WELLMANIFEST_HOST:-0.0.0.0}
  WELLMANIFEST_PORT: ${WELLMANIFEST_PORT:-8080}
  WELLMANIFEST_CONTRACTS: ${WELLMANIFEST_CONTRACTS:-/app/config/contracts.json}
  WELLMANIFEST_DEFAULT_CONTRACT: ${WELLMANIFEST_DEFAULT_CONTRACT:-contract:dev}
  WELLMANIFEST_EVENT_STORE: ${WELLMANIFEST_EVENT_STORE:-/data/events.jsonl}
  WELLMANIFEST_WORKSPACE_ROOT: ${WELLMANIFEST_WORKSPACE_ROOT:-/workspace}
  WELLMANIFEST_ENABLE_PLESK_EXECUTION: ${WELLMANIFEST_ENABLE_PLESK_EXECUTION:-0}
  WELLMANIFEST_TOKEN: ${WELLMANIFEST_TOKEN:-}

x-runtime: &runtime
  image: ${WELLMANIFEST_IMAGE:-wellmanifest/wellm}:${WELLMANIFEST_IMAGE_TAG:-0.2.0rc4-dev}
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  environment: *runtime-environment
  volumes:
    - wellmanifest-data:/data
    - ./config/contracts.json:/app/config/contracts.json:ro

services:
  runtime:
    <<: *runtime
    ports:
      - "${WELLMANIFEST_HTTP_HOST_PORT:-8080}:8080"
    networks: [public, runtime]

  grpc:
    <<: *runtime
    entrypoint: ["wellmanifest-grpc"]
    environment:
      <<: *runtime-environment
      WELLMANIFEST_EVENT_STORE: /data/grpc-events.jsonl
      WELLMANIFEST_GRPC_ADDRESS: ${WELLMANIFEST_GRPC_ADDRESS:-0.0.0.0:50051}
      WELLMANIFEST_GRPC_WORKERS: ${WELLMANIFEST_GRPC_WORKERS:-8}
    ports:
      - "${WELLMANIFEST_GRPC_HOST_PORT:-50051}:50051"
    networks: [runtime]
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; grpc.channel_ready_future(grpc.insecure_channel('127.0.0.1:50051')).result(timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12

  mqtt:
    image: eclipse-mosquitto:2.0.21
    command: ["mosquitto", "-c", "/mosquitto-no-auth.conf"]
    volumes:
      - ./docker/mosquitto.conf:/mosquitto-no-auth.conf:ro
    ports:
      - "${WELLMANIFEST_MQTT_HOST_PORT:-1883}:1883"
    networks: [runtime]
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -t '$$SYS/broker/version' -C 1 -W 2 >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20

  mqtt-bridge:
    <<: *runtime
    entrypoint: ["wellmanifest-mqtt"]
    environment:
      <<: *runtime-environment
      WELLMANIFEST_EVENT_STORE: /data/events.jsonl
      WELLMANIFEST_MQTT_HOST: ${WELLMANIFEST_MQTT_HOST:-mqtt}
      WELLMANIFEST_MQTT_PORT: ${WELLMANIFEST_MQTT_PORT:-1883}
      WELLMANIFEST_MQTT_USERNAME: ${WELLMANIFEST_MQTT_USERNAME:-}
      WELLMANIFEST_MQTT_PASSWORD: ${WELLMANIFEST_MQTT_PASSWORD:-}
      WELLMANIFEST_MQTT_REQUEST_TOPIC: ${WELLMANIFEST_MQTT_REQUEST_TOPIC:-wellmanifest/v1/default/request/#}
      WELLMANIFEST_TENANT: ${WELLMANIFEST_TENANT:-default}
    depends_on:
      mqtt:
        condition: service_healthy
    networks: [runtime]
    healthcheck:
      disable: true

  www:
    build:
      context: .
      dockerfile: docker/www.Dockerfile
    image: wellmanifest/wellm-www:${WELLMANIFEST_IMAGE_TAG:-0.2.0rc4-dev}
    ports:
      - "${WELLMANIFEST_WWW_HOST_PORT:-8088}:8080"
    depends_on:
      runtime:
        condition: service_healthy
    networks: [public, runtime]

  firmware-sim:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: docker/firmware-sim.Dockerfile
    environment:
      WELLMANIFEST_URL: http://runtime:8080
      WELLMANIFEST_CONTRACT: ${WELLMANIFEST_CONTRACT:-contract:firmware-thin}
      WELLMANIFEST_TOKEN: ${WELLMANIFEST_TOKEN:-}
    depends_on:
      runtime:
        condition: service_healthy
    networks: [runtime]

volumes:
  wellmanifest-data: {}

networks:
  public:
    ipam:
      config:
        - subnet: ${WELLMANIFEST_PUBLIC_SUBNET:-172.30.240.0/24}
  runtime:
    internal: false
    ipam:
      config:
        - subnet: ${WELLMANIFEST_RUNTIME_SUBNET:-172.30.241.0/24}
