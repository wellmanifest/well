server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    alias /usr/share/nginx/html/;
    expires 1h;
  }

  location /healthz { proxy_pass http://runtime:8080; }
  location /v1/ { proxy_pass http://runtime:8080; proxy_http_version 1.1; }
  location /run { proxy_pass http://runtime:8080; proxy_http_version 1.1; }
  location /v1/ws {
    proxy_pass http://runtime:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
