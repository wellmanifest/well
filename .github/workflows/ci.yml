name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python }}'}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: wellm capabilities
      - run: wellm governance build examples/governance/wellm.project.yaml --check

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - working-directory: packages/js
        run: npm test
      - working-directory: packages/js
        run: npm run check

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.82.0'
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p wellmanifest-core -p wellmanifest-cli --all-targets -- -D warnings
      - run: cargo test -p wellmanifest-core -p wellmanifest-cli
      - run: cargo check -p wellmanifest-python -p wellmanifest-node
      - run: cargo build --release -p wellmanifest-wasm --target wasm32-unknown-unknown

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install -e ".[dev]"
      - run: ./scripts/verify.sh
      - run: ./scripts/e2e-local.sh
