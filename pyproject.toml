[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wellmanifest"
version = "0.1.7"
description = "Polyglot manifest protocol, dialect runtime and remote execution gateway"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "WellManifest contributors"}, {name = "Tom Sapletta",email = "tom@sapletta.com"}]
keywords = ["dsl", "manifest", "json-schema", "hcl", "mqtt", "grpc", "digital-twin", "iot"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "jsonschema>=4.18",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "websockets>=12",
  "protobuf>=5",
]

[project.optional-dependencies]
mqtt = ["paho-mqtt>=2.1"]
grpc = ["grpcio>=1.60", "grpcio-tools>=1.60"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8",
    "goal>=2.1.0",
    "costs>=0.1.53",
    "pfix>=0.1.60",
]
all = ["paho-mqtt>=2.1", "grpcio>=1.60", "grpcio-tools>=1.60"]

[project.scripts]
wellmanifest = "wellmanifest.cli:main"
wellmanifest-server = "wellmanifest.server:main"
wellmanifest-mqtt = "wellmanifest.mqtt_bridge:main"
wellmanifest-grpc = "wellmanifest.grpc_server:main"
wellmanifest-hcl = "wellmanifest.entrypoints:hcl"
wellmanifest-typed = "wellmanifest.entrypoints:typed"
wellmanifest-policy = "wellmanifest.entrypoints:policy"
wellmanifest-yaml = "wellmanifest.entrypoints:yaml"
wellmanifest-proto3 = "wellmanifest.entrypoints:proto3"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wellmanifest = ["static/*", "resources/*.json", "generated/*.py"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.costs]
# AI Cost tracking configuration
badge = true
update_readme = true
readme_path = "README.md"
default_model = "openrouter/qwen/qwen3-coder-next"
analysis_mode = "byok"
full_history = true
max_commits = 500

# Cost thresholds for badge colors (USD)
badge_color_thresholds = { low = 1.0, medium = 5.0, high = 10.0, critical = 50.0 }

[tool.pfix]
# Self-healing Python configuration
model = "openrouter/qwen/qwen3-coder-next"
auto_apply = true
auto_install_deps = true
auto_restart = false
max_retries = 3
create_backups = false
git_auto_commit = false

[tool.pfix.runtime_todo]
enabled = true
todo_file = "TODO.md"
min_severity = "low"
deduplicate = true
